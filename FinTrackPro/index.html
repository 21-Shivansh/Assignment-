<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <!------------ SideBar ------------>
        <div class="sideBar">
            <div class="sb1">
                <div class="logoDiv">
                    <img src="/assets/logo.png" class="logo_img" alt="">
                    <p class="logo_name">FinTrack</p>
                </div>
                <div class="sb_optDiv">
                    <div class="sb_optDiv1">
                        <img src="/assets/dashboard.png" class="dashboard_img" alt="">
                        <p>Dashboard</p>
                    </div> 
                    <div class="sb_optDiv2">
                        <img src="assets/setting.png" alt="" class="setting_img">
                       <p >Setting</p> 
                    </div>                   
                </div>
            </div>
            <div class="sb2">
                <p class="sb2_text">Log Out</p>
            </div>
        </div>
        <!---------- Dashboard Page ---------->
        <div class="dashboardPage">
            <nav class="dashboardPage_nav">
                <div class="dn_text">
                    <p class="dn_text1">Financial Overview</p>
                    <p class="dn_text2">Real-time tracking application</p>
                </div>
                <div class="dn_button">
                    <p class="dn_button_text">+ Add Transaction</p>
                </div>
            </nav>
            <main class="dashboardPage_main">
                <div class="dm1">
                    <div class="dm1_logo_div">
                        <img src="assets/bank.png" alt="" class="bank_img">
                    </div>
                    <p class="dm1_text">Current Balance</p>
                    <p class="dm1_textNum"><span class="dm1_textNum curr">$</span>0.00</p>
                </div>
                <div class="dm2">
                    <div class="dm2_logo_div">
                        <img src="assets/up.png" alt="" class="bank_img">
                    </div>
                    <p class="dm2_text">Credited</p>
                    <p class="dm2_textNum"><span class="dm2_textNum curr">$</span>0.00</p>
                </div>
                <div class="dm3">
                    <div class="dm3_logo_div">
                        <img src="assets/down.png" alt="" class="bank_img">
                    </div>
                    <p class="dm3_text">Debited</p>
                    <p class="dm3_textNum"><span class="dm3_textNum curr">$</span>0.00</p>
                </div>
                <div class="dm4">
                    <div class="dm1_logo_div">
                        <img src="assets/transaction.png" alt="" class="bank_img">
                    </div>
                    <p class="dm4_text">Transactions</p>
                    <p class="dm4_textNum">0</p>
                </div>
                <div class="dm5">
                    <p class="dm5_heading">Transaction History</p>
                    <div class="dm5_inpDiv">
                        <div class="dm5_inpDiv1">
                            <img src="assets/search.png" class="search_img" alt="">
                            <input placeholder="Search Transaction..." type="text" class="dm5_inp1">
                        </div>
                        <select name="Filter" class="dm5_select" id="">
                            <option value="allType">All Type</option>
                            <option value="credited">Credited</option>
                            <option value="debited">Debited</option>
                        </select>
                    </div>
                    <div class="dm5_labelDiv">
                        <p class="dm5_labelDiv_text">Date</p>
                        <p class="dm5_labelDiv_text">Description</p>
                        <p class="dm5_labelDiv_text">Category</p>
                        <p class="dm5_labelDiv_text">Amount</p>
                        <p class="dm5_labelDiv_text">Actions</p>
                    </div>
                    
                </div>
                <div class="dm6"></div>
                <div class="dm7"></div>
            </main>
        </div>
    </main>
</body>
</html>
