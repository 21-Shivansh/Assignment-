<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <!------------ SideBar ------------>
        <div class="sideBar">
            <div class="sb1">
                <div class="logoDiv">
                    <img src="/assets/logo.png" class="logo_img" alt="">
                    <p class="logo_name">FinTrack</p>
                </div>
                <div class="sb_optDiv">
                    <div class="sb_optDiv1">
                        <img src="/assets/dashboard.png" class="dashboard_img" alt="">
                        <p>Dashboard</p>
                    </div> 
                    <div class="sb_optDiv2">
                        <img src="assets/setting.png" alt="" class="setting_img">
                       <p >Setting</p> 
                    </div>                   
                </div>
            </div>
            <div class="sb2">
                <p class="sb2_text">Log Out</p>
            </div>
        </div>
        <!---------- Dashboard Page ---------->
        <div class="dashboardPage">
            <nav class="dashboardPage_nav">
                <div class="dn_text">
                    <p class="dn_text1">Financial Overview</p>
                    <p class="dn_text2">Real-time tracking application</p>
                </div>
                <div class="dn_button">
                    <p class="dn_button_text">+ Add Transaction</p>
                </div>
            </nav>
            <main class="dashboardPage_main">
                <div class="dm1">
                    
                </div>
                <div class="dm2"></div>
                <div class="dm3"></div>
                <div class="dm4"></div>
                <div class="dm5"></div>
                <div class="dm6"></div>
                <div class="dm7"></div>
            </main>
        </div>
    </main>
</body>
</html>
